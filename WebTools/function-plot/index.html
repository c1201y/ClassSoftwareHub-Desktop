le.navigationview.default-description":`If you have five or more equally important navigation categories that should prominently appear on larger window widths, consider using a left navigation pane.`,"sample.navigationview.top-description":`If you have equally important navigation categories that should be de-emphasized relative to the content of your app, consider using a top navigation pane.`,"sample.navigationview.adaptive-description":`If you have equally important navigation categories and limited app content space, consider using a top navigation pane on larger window widths and a minimal left navigation pane on smaller window widths.`,"sample.navigationview.tabs-description":`For the tabs pattern, ensure that you unify selection and focus by setting the SelectionFollowsFocus property to Enabled. If using a Frame to swap out content, then navigating between items shouldn't be recorded into the Frame's navigation stack. Please see the C# in the sample below to understand how to do this.`,"sample.navigationview.data-binding-description":`When data binding, use the MenuItemsSource property to bind to an observable collection of items, and do not set the MenuItems property. In addition, set the MenuItemTemplate property and use a NavigationViewItem as the data template. If you wish to bind to the header content as well, use data template selectors via the MenuItemTemplateSelector property.`,"sample.navigationview.footer-description":`You can add clickable menu items to the footer of your NavigationView that participate in the same selection model as items in the main menu. In Top PaneDisplayMode, these items will appear aligned to the right of the NavigationView. In Left PaneDisplayMode, these items will appear aligned to the bottom of the NavigationView.`,"sample.navigationview.hierarchy-description-1":`NavigationView supports hierarchy in Left, LeftCompact, and Top display modes.`,"sample.navigationview.hierarchy-description-2":`In the example below, the "Account" tab navigates to its own page while "Document options" only opens its subtree of items. This is done by setting the SelectsOnInvoked property to false on the Document options NavigationView item.`,"sample.navigationview.hierarchy-description-3":`In both Top and Left modes, clicking the arrows on NavigationViewItems will expand or collapse the subtree. Clicking or tapping elsewhere on the NavigationViewItem will also collapse or expand the subtree.`,"sample.navigationview.hierarchy-description-4":`Switch between the three pane display modes on the right.`,"sample.navigationview.header-text":`This is Header Text`,"sample.navigationview.menu-item-1":`Menu Item1`,"sample.navigationview.menu-item-2":`Menu Item2`,"sample.navigationview.menu-item-3":`Menu Item3`,"sample.navigationview.menu-item-4":`Menu Item4`,"sample.navigationview.item-1":`Item1`,"sample.navigationview.item-2":`Item2`,"sample.navigationview.item-3":`Item3`,"sample.navigationview.item-4":`Item4`,"sample.navigationview.sample-page":`Sample Page {number}`,"sample.navigationview.settings-page":`Sample Settings Page`,"sample.navigationview.lorem-title":`Lorem ipsum dolor sit amet, consectetur adipiscing elit`,"sample.navigationview.lorem-body":`Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.`,"sample.navigationview.category":`Category {number}`,"sample.navigationview.category-tooltip":`This is category {number}`,"sample.navigationview.browse":`Browse`,"sample.navigationview.track-order":`Track an Order`,"sample.navigationview.order-history":`Order History`,"sample.navigationview.account":`Account`,"sample.navigatio
